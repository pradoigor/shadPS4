name: Xbox UWP diagnostics
on:
  workflow_dispatch:
  push:
    branches: [xbox-uwp]
    paths: ['xbox/**', '.github/workflows/xbox-uwp.yml']
permissions:
  contents: read
concurrency:
  group: xbox-uwp-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and sign diagnostic APPX
        shell: pwsh
        run: ./xbox/scripts/build.ps1
      - name: Upload package, dependencies, symbols and build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shadPS4-Xbox-Lab-${{ github.sha }}
          path: xbox/artifacts/
          if-no-files-found: warn
          retention-days: 14
